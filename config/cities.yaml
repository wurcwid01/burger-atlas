    districts:
      - slug: downtown
        name: Downtown
        center: { lat: 10.6680, lng: 122.9480 }
        radius_m: 1500
        aliases: ["Downtown"]
      - slug: lacson
        name: Lacson
        center: { lat: 10.6840, lng: 122.9560 }
        radius_m: 1500
        aliases: ["Lacson"]
      - slug: mandalagan
        name: Mandalagan
        center: { lat: 10.7000, lng: 122.9600 }
        radius_m: 1800
        aliases: ["Mandalagan"]

  cebu-city:
    name: Cebu City
    region: Central Visayas
    country_code: PH
    enabled: false
    currency_symbol: "₱"
    center: { lat: 10.3157, lng: 123.8854 }
    zoom: 13
    bounds: { south: 10.2700, west: 123.8400, north: 10.3600, east: 123.9300 }
    districts:
      - slug: it-park
        name: IT Park / Lahug
        center: { lat: 10.3300, lng: 123.9050 }
